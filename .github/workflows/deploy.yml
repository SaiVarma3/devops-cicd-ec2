
name: Deploy Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: sudo docker build -t my-web-app:latest .

      - name: Deploy website
        run: |
          sudo docker rm -f my-web-app || true
          sudo docker run -d \
            --name my-web-app \
            -p 80:80 \
            --restart unless-stopped \
            my-web-app:latest

      - name: Verify container
        run: sudo docker ps --filter name=my-web-app
